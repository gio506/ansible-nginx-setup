---
name: ansible-ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ansible-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure-check:
    name: Structure check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify required files
        shell: bash
        run: |
          required_files=(
            "README.md"
            "CHEATSHEET.md"
            "FILES_EXPLAINED.md"
            "inventory/example"
            "playbook.yml"
            "roles/nginx/tasks/main.yml"
            "scripts/container_smoke.sh"
          )
          for file in "${required_files[@]}"; do
            test -f "$file" || {
              echo "Missing required file: $file"
              exit 1
            }
          done

  yaml-lint:
    name: YAML lint
    runs-on: ubuntu-latest
    needs: structure-check
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ibiqlik/action-yamllint@v3

  ansible-lint:
    name: Ansible lint
    runs-on: ubuntu-latest
    needs: yaml-lint
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install ansible and ansible-lint
        run: |
          python -m pip install --upgrade pip
          pip install ansible ansible-lint
      - name: Run ansible-lint
        run: ansible-lint

  syntax-check:
    name: Ansible syntax-check
    runs-on: ubuntu-latest
    needs: ansible-lint
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible
      - name: Syntax check
        run: ansible-playbook -i inventory/example playbook.yml --syntax-check

  smoke-test:
    name: Container smoke test
    runs-on: ubuntu-latest
    needs: syntax-check
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run container smoke test
        run: bash scripts/container_smoke.sh

  final-status-gate:
    name: Final status gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - structure-check
      - yaml-lint
      - ansible-lint
      - syntax-check
      - smoke-test
    steps:
      - name: Aggregate results
        shell: bash
        env:
          STRUCTURE: ${{ needs.structure-check.result }}
          YAML: ${{ needs.yaml-lint.result }}
          ANSIBLE: ${{ needs.ansible-lint.result }}
          SYNTAX: ${{ needs.syntax-check.result }}
          SMOKE: ${{ needs.smoke-test.result }}
        run: |
          for result in "$STRUCTURE" "$YAML" "$ANSIBLE" "$SYNTAX" "$SMOKE"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              exit 1
            fi
          done
