---
- name: Install nginx package
  ansible.builtin.package:
    name: "{{ nginx_package_name }}"
    state: present

- name: Ensure nginx document root exists
  ansible.builtin.file:
    path: "{{ nginx_docroot }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy nginx site configuration
  ansible.builtin.template:
    src: site.conf.j2
    dest: "{{ nginx_site_config_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart nginx

- name: Disable distro default site when present
  ansible.builtin.file:
    path: "{{ nginx_default_site_path }}"
    state: absent
  when: nginx_default_site_path | length > 0
  notify: Restart nginx

- name: Deploy index page
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ nginx_index_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart nginx

- name: Ensure nginx service is enabled and running
  ansible.builtin.service:
    name: "{{ nginx_service_name }}"
    enabled: true
    state: started
  when: nginx_manage_service | bool
