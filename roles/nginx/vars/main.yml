---
nginx_runtime_user_map:
  Debian: www-data
  RedHat: nginx

nginx_docroot_map:
  Debian: /var/www/html
  RedHat: /usr/share/nginx/html

nginx_site_config_path_map:
  Debian: /etc/nginx/conf.d/ansible-nginx.conf
  RedHat: /etc/nginx/conf.d/default.conf

nginx_default_site_path_map:
  Debian: /etc/nginx/sites-enabled/default
  RedHat: ""

nginx_runtime_user: "{{ nginx_runtime_user_map.get(ansible_os_family, 'nginx') }}"
